[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lekhak"
version = "0.1.0"
description = "A reliable, Linux-first environment for long-form writing"
# Floor is 3.9 by policy (see ROADMAP working agreements): the code only
# needs str.removeprefix (3.9); every X | None annotation is lazy thanks to
# `from __future__ import annotations`. pip resolves a matching PySide6.
requires-python = ">=3.9"
# Stated as a classifier rather than a PEP 639 SPDX string: that form needs
# setuptools 77+, and the build requirement admits 68. The licence text
# is in LICENSE.
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
dependencies = ["PySide6>=6.6", "python-docx>=1.1"]

[project.scripts]
lekhak = "lekhak.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
